name: Auto Green

on:
  schedule:
    # 09:17 Japan Standard Time (00:17 UTC), every day
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-green
  cancel-in-progress: false

jobs:
  auto-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create one empty commit
        run: |
          git config user.name "Xihao Yang"
          git config user.email "249629196+xihao-yang@users.noreply.github.com"
          git commit --allow-empty -m "chore: daily activity check"
          git push origin HEAD:main
